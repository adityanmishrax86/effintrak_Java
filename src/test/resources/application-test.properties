spring.application.name=effinTrak
# Testcontainers will override these values dynamically
spring.datasource.url=jdbc:postgresql://localhost:5432/test_effintrak
spring.datasource.username=test
spring.datasource.password=test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.azaxxc.effintrakj=DEBUG
logging.level.org.testcontainers=INFO

# Disable devtools for tests
spring.devtools.restart.enabled=false

# AI test configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
app.ai.default-model=llama-3.3-70b-versatile
app.ai.supported-models=llama-3.3-70b-versatile,llama3-8b-8192
app.ai.allow-model-override=true
app.ai.enable-response-formatting=true
app.ai.enforce-tool-policies=true
app.ai.max-prompt-length=2000
app.ai.enabled-operations=ADD_EXPENSE,ADD_INCOME,UPDATE_EXPENSE,DELETE_EXPENSE,GET_MONTHLY_SPENDING,GET_MONTHLY_INCOME,GET_FINANCIAL_SUMMARY,GET_SPENDING_BY_CATEGORY,CREATE_SAVINGS_GOAL,GET_SAVINGS_PROGRESS,ADD_TO_SAVINGS,WITHDRAW_FROM_SAVINGS,UPDATE_BUDGET,ADD_SUBSCRIPTION,GET_ACTIVE_SUBSCRIPTIONS,CANCEL_SUBSCRIPTION,ADD_CREDIT,GET_ACTIVE_CREDITS,MAKE_CREDIT_PAYMENT,TRANSFER_MONEY,CREATE_RECURRING_TRANSACTION,GET_ACTIVE_RECURRING_TRANSACTIONS,PAUSE_RECURRING_TRANSACTION,DELETE_RECURRING_TRANSACTION,QUERY_FINANCIAL_DATA
app.ai.prompt-profile=dev
app.ai.prompt-version=test-v1

# Observability test configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
