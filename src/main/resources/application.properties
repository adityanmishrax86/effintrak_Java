spring.application.name=effinTrak
spring.datasource.url=jdbc:postgresql://localhost:5432/effintrak
spring.datasource.username=azax25547
spring.datasource.password=CykaBlyat
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true


spring.ai.openai.api-key=lol
spring.ai.openai.base-url=https://api.groq.com/openai

# Model Selection
# Recommended free models on Groq: llama-3.3-70b-versatile or llama3-8b-8192
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# LLM Parameters
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2048

# Tool/Function Calling Configuration
spring.ai.openai.chat.options.function-call-mode=auto
spring.ai.openai.chat.options.top-p=1.0

# Streaming disabled to avoid authentication issues with tool calling
spring.ai.openai.chat.options.stream=false

# Ensures the AI actually follows through with tool calls
spring.ai.openai.chat.options.internal-proxies-enabled=true

# Logging Configuration for Debugging
logging.level.root=INFO
logging.level.com.azaxxc.effintrakj.effinTrak.financetools=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.http.client=DEBUG
