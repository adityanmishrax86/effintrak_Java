spring.application.name=effinTrak
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/azax25547}
spring.datasource.username=${DB_USERNAME:azax25547}
spring.datasource.password=${DB_PASSWORD:CykaBlyat}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET:change-this-jwt-secret-in-prod}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:36000000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


spring.ai.openai.api-key=${NVIDIA_API_KEY:${OPENAI_API_KEY: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}}
spring.ai.openai.base-url=https://integrate.api.nvidia.com

# Model Selection
# NVIDIA NIM model example
spring.ai.openai.chat.options.model=google/gemma-3n-e4b-it

# LLM Parameters
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=2048

# Tool/Function Calling Configuration
spring.ai.openai.chat.options.function-call-mode=auto
spring.ai.openai.chat.options.top-p=0.7

# Streaming disabled to avoid authentication issues with tool calling
spring.ai.openai.chat.options.stream=false

# Ensures the AI actually follows through with tool calls
spring.ai.openai.chat.options.internal-proxies-enabled=true

# Central AI backend configuration
app.ai.default-model=${spring.ai.openai.chat.options.model}
app.ai.supported-models=google/gemma-3n-e4b-it
app.ai.allow-model-override=false
app.ai.enable-response-formatting=true
app.ai.enforce-tool-policies=true
app.ai.max-prompt-length=2000
app.ai.enabled-operations=ADD_EXPENSE,ADD_INCOME,UPDATE_EXPENSE,DELETE_EXPENSE,GET_MONTHLY_SPENDING,GET_MONTHLY_INCOME,GET_FINANCIAL_SUMMARY,GET_SPENDING_BY_CATEGORY,CREATE_SAVINGS_GOAL,GET_SAVINGS_PROGRESS,ADD_TO_SAVINGS,WITHDRAW_FROM_SAVINGS,UPDATE_BUDGET,ADD_SUBSCRIPTION,GET_ACTIVE_SUBSCRIPTIONS,CANCEL_SUBSCRIPTION,ADD_CREDIT,GET_ACTIVE_CREDITS,MAKE_CREDIT_PAYMENT,TRANSFER_MONEY,CREATE_RECURRING_TRANSACTION,GET_ACTIVE_RECURRING_TRANSACTIONS,PAUSE_RECURRING_TRANSACTION,DELETE_RECURRING_TRANSACTION,QUERY_FINANCIAL_DATA
app.ai.prompt-profile=prod
app.ai.prompt-version=v1

# Logging Configuration for Debugging
logging.level.root=INFO
logging.level.com.azaxxc.effintrakj.effinTrak.financetools=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.web.client=DEBUG
logging.level.org.springframework.http.client=DEBUG
