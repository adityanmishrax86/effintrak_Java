services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: effintrak-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-effintrak}
      POSTGRES_USER: ${POSTGRES_USER:-effintrak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-effintrak_user} -d ${POSTGRES_DB:-effintrak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - effintrak-network
    restart: unless-stopped

  # Spring Boot Application
  app:
    image: azax25547/effintrak-backend:0.1.0
    pull_policy: never
    container_name: effintrak-app-prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-effintrak}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-effintrak_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Production JVM Options
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      # Logging
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - effintrak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    image: azax25547/effintrak-frontend:0.1.0
    pull_policy: never
    container_name: effintrak-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_BASE_PATH: ${NEXT_BASE_PATH:-/app}
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - effintrak-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  effintrak-network:
    driver: bridge
