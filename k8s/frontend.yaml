apiVersion: apps/v1
kind: Deployment
metadata:
  name: effintrak-frontend
  labels:
    app: effintrak
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: effintrak
      component: frontend
  template:
    metadata:
      labels:
        app: effintrak
        component: frontend
    spec:
      containers:
      - name: frontend
        image: effintrakjava-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "/api"
        - name: NEXT_BASE_PATH
          value: "/app"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 40
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: effintrak-frontend-service
  labels:
    app: effintrak
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: effintrak
    component: frontend
