apiVersion: v1
kind: ConfigMap
metadata:
  name: effintrak-prometheus-config
  labels:
    app: effintrak
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "effintrak-app"
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["effintrak-app-service:80"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: effintrak-prometheus
  labels:
    app: effintrak
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: effintrak
      component: monitoring
  template:
    metadata:
      labels:
        app: effintrak
        component: monitoring
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.54.1
        imagePullPolicy: IfNotPresent
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.enable-lifecycle
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
          readOnly: true
      volumes:
      - name: prometheus-config
        configMap:
          name: effintrak-prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: effintrak-prometheus-service
  labels:
    app: effintrak
    component: monitoring
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: http
  selector:
    app: effintrak
    component: monitoring
