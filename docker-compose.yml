version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: effintrak-postgres
    environment:
      POSTGRES_DB: effintrak
      POSTGRES_USER: effintrak_user
      POSTGRES_PASSWORD: effintrak_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/sql/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effintrak_user -d effintrak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - effintrak-network

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: effintrak-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/effintrak
      SPRING_DATASOURCE_USERNAME: effintrak_user
      SPRING_DATASOURCE_PASSWORD: effintrak_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # JVM Options
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - effintrak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: effintrak-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - effintrak-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
        NEXT_BASE_PATH: ${NEXT_BASE_PATH:-}
    container_name: effintrak-frontend
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - effintrak-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  effintrak-network:
    driver: bridge
